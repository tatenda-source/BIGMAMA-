<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="BIGMAMA$ — civic engagement platform for reporting illegal land deals and protecting communities." />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,nofollow" />
    <!--
      Content-Security-Policy is deliberately NOT set here. Browsers intersect
      meta CSP with header CSP, and Vite's HMR in dev needs 'unsafe-inline' +
      'unsafe-eval' that a strict meta would forbid. The production CSP
      (including frame-ancestors, which is meta-ignored anyway) must ship via
      HTTP response headers — see docs/security.md for the exact policy every
      deploy target must send.
    -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Permissions-Policy" content="camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), interest-cohort=()" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>BIGMAMA$ — Civic Reporting</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="color:#f5f5f7;font-family:system-ui;padding:24px;max-width:640px;margin:auto;">
        BIGMAMA$ needs JavaScript to protect your report before it leaves your
        device. Please enable JavaScript or switch to a browser that supports it.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
